<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ocean</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #05080c; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #c9d6df; background: #05080c; transition: opacity 1.2s; z-index: 10; letter-spacing: 0.08em; font-size: 13px; text-transform: uppercase; }
      #loading.done { opacity: 0; pointer-events: none; }
      #bar { width: 220px; height: 2px; background: #1b2731; }
      #bar > div { height: 100%; width: 0%; background: #c9d6df; transition: width 0.2s; }
      #hint { position: fixed; left: 16px; bottom: 14px; max-width: 26vw; line-height: 1.5; color: rgba(255, 255, 255, 0.55); font-size: 12px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); pointer-events: none; }
      #error { color: #ff9a8a; max-width: 520px; text-align: center; text-transform: none; letter-spacing: 0; }
      .hidden-ui #hint, .hidden-ui .lil-gui, .hidden-ui #panel, .hidden-ui #hud { display: none !important; }
      .panel, .hud { color: #e8eef2; background: rgba(10, 16, 22, 0.52); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25); }
      .panel { position: fixed; top: 14px; left: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; max-width: min(560px, calc(100vw - 28px)); z-index: 5; }
      .panel .row { display: flex; align-items: center; gap: 10px; }
      .panel .label { width: 44px; flex: none; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(232, 238, 242, 0.6); }
      .pills { display: flex; flex-wrap: wrap; gap: 5px; }
      .pill { font: inherit; font-size: 12.5px; color: #e8eef2; background: rgba(255, 255, 255, 0.08); border: 1px solid transparent; border-radius: 999px; padding: 5px 11px; cursor: pointer; transition: background 0.15s; }
      .pill:hover { background: rgba(255, 255, 255, 0.18); }
      .pill.on { background: #e8eef2; color: #0b1218; }
      .panel input[type='range'] { flex: 1; accent-color: #e8eef2; min-width: 120px; }
      .hud { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 22px; padding: 9px 20px; z-index: 5; }
      .hud .cell { display: flex; flex-direction: column; align-items: center; min-width: 74px; }
      .hud .value { font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 500; min-height: 25px; display: flex; align-items: center; justify-content: center; width: 100%; }
      .hud .name { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(232, 238, 242, 0.6); margin-top: 2px; white-space: pre; }
      .hud .bar { position: relative; width: 92px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
      .hud .bar > div { height: 100%; background: #e8eef2; border-radius: 3px; }
      .hud .bar.rudder { overflow: visible; }
      .hud .bar.rudder > div { position: absolute; top: -3px; width: 4px; height: 12px; margin-left: -2px; }
      .lil-gui.root { top: 14px !important; right: 14px !important; }
      @media (max-width: 700px) { .hud { gap: 10px; padding: 8px 12px; } .hud .cell { min-width: 58px; } .hud .bar { width: 64px; } #hint { display: none; } }
    </style>
  </head>
  <body>
    <div id="loading"><div id="status">Loading</div><div id="bar"><div></div></div><div id="error"></div></div>
    <div id="hint">W / S sails &middot; A / D rudder &middot; drag to look around &middot; scroll to zoom &middot; 1-5 views &middot; Space pause &middot; H hide controls</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
